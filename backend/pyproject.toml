[project]
name = "facultydesk-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0.2",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.30.0",
    "celery[redis]>=5.4.0",
    "dateparser>=1.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "minio>=7.2.10",
    "opencv-python-headless>=4.10.0.84",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
    "pypdfium2>=4.30.0",
    "pytesseract>=0.3.13",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.32",
    "pywebpush>=2.0.1",
    "rapidfuzz>=3.10.1",
    "redis>=5.2.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "hypothesis>=6.120.0",
    "icalendar>=6.0.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.3",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "types-openpyxl>=3.1.5.20261017",
    "types-python-dateutil>=2.9.0.20241001",
    "types-redis>=4.6.0.20241004",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF"
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Cookie",
    "fastapi.params.Cookie",
    "fastapi.File",
    "fastapi.params.File",
    "fastapi.Form",
    "fastapi.params.Form",
    "fastapi.Header",
    "fastapi.params.Header",
    "fastapi.Query",
    "fastapi.params.Query",
    "fastapi.Security",
    "fastapi.params.Security",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "pywebpush.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

